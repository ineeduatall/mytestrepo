<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tally Counter</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.7);
      --drawer-bg: #1c1c1e;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --accent: #0a84ff;
      --danger: #ff453a;
      --border-radius: 16px;
    }

    /* Modern Light Theme */
    body.theme-light {
      --bg-color: #ffffff;
      --card-bg: rgba(242, 242, 247, 0.7);
      --drawer-bg: #f2f2f7;
      --text-main: #000000;
      --text-sub: #8e8e93;
      --accent: #007aff;
      --danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; /* Removes blue tap flashing */
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease;
    }

    /* Top Bar Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 8px;
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Limiter Control Bar */
    .limiter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--card-bg);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
    }

    .limiter-bar label {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .limiter-bar input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: bold;
      width: 70px;
      text-align: center;
      outline: none;
    }

    .limiter-bar input::-webkit-inner-spin-button,
    .limiter-bar input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Main Counter Screen Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      width: 100%;
      height: 100%;
      padding-top: 70px;
      padding-bottom: 60px; /* Space at bottom for tapping */
      gap: 12px;
      overflow: hidden; /* Fixed back canvas */
    }

    .count-display {
      font-size: min(20vw, 100px);
      font-weight: 800;
      letter-spacing: -2px;
      transition: transform 0.05s ease;
      z-index: 1;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .read-container {
      display: none;
      flex-direction: column;
      width: 92%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 5;
      transition: all 0.3s ease;
      flex-shrink: 1; /* Allow to shrink if content is tall */
      overflow: hidden;
      min-height: 0; /* Important for flex-shrink to work with nested scroll */
    }

    .read-container.active {
      display: flex;
    }

    .read-header {
      padding: 6px 12px;
      display: flex;
      justify-content: flex-end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .read-type-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 2px;
    }

    .read-type-btn {
      padding: 3px 10px;
      border-radius: 18px;
      border: none;
      background: none;
      color: var(--text-sub);
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .read-type-btn.active {
      background: var(--accent);
      color: white;
    }

    .read-content {
      padding: 12px;
      min-height: 80px;
      overflow-y: auto; /* Scroll inside the box only */
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    #readTextArea {
      width: 100%;
      min-height: 100px;
      background: transparent;
      border: none;
      color: var(--text-main);
      resize: none;
      outline: none;
      font-size: 0.95rem;
      line-height: 1.5;
      flex-shrink: 0;
    }

    #readImageContainer {
      width: 100%;
      display: none;
      align-items: flex-start; /* Fix: ensures top is not covered when scrolling */
      justify-content: center;
      min-height: 100px;
      cursor: pointer;
    }

    #readImageContainer img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }

    .image-placeholder {
      color: var(--text-sub);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    /* Toggle in Drawer */
    .drawer-item-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #334155;
      transition: .4s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .drawer-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .count-display.bump {
      transform: scale(1.08);
    }

    .count-display.at-limit {
      color: var(--danger);
    }

    /* Side Drawer Elements */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--drawer-bg);
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 18px 16px;
      gap: 24px;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.3);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drawer-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .theme-btn {
      height: 40px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .theme-btn.active {
      border-color: var(--text-main);
    }

    .history-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* Flat Vector SVG Icons */
    .icon {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

<!-- Drawer & Overlay -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-section">
    <div class="drawer-item-toggle">
      <span class="drawer-title" style="margin:0;">MODE: Clean / Read</span>
      <label class="switch">
        <input type="checkbox" id="modeSwitch">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="drawer-section">
    <span class="drawer-title">Appearance</span>
    <div class="theme-options" style="grid-template-columns: 1fr 1fr;">
      <button class="theme-btn active" data-theme="default" style="background: #1c1c1e; border: 1px solid #3a3a3c;" title="Modern Dark"></button>
      <button class="theme-btn" data-theme="theme-light" style="background: #f2f2f7; border: 1px solid #d1d1d6;" title="Modern Light"></button>
    </div>
  </div>

  <div class="drawer-section">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="drawer-title">History Log</span>
      <!-- Clear History Button -->
      <button id="clearHistoryBtn" style="background:none; border:none; color:var(--danger); font-size:0.75rem; cursor:pointer; font-weight:bold; padding: 2px 4px;">Clear</button>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>
</aside>


  <!-- Top Header Bar -->
  <header>
    <button class="icon-btn" id="drawerBtn" aria-label="Open Drawer">
      <svg class="icon" viewBox="0 0 24 24">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="header-right">
      <button class="icon-btn" id="feedbackToggleBtn" aria-label="Feedback Mode">
        <svg class="icon" id="modeIcon" viewBox="0 0 24 24"></svg>
      </button>

      <button class="icon-btn" id="resetBtn" aria-label="Reset Counter">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Fullscreen Tap Surface -->
  <main id="tapArea">
    <!-- Limiter Bar -->
    <div class="limiter-bar" id="limiterContainer">
      <label for="limitInput">Limit:</label>
      <input type="number" id="limitInput" placeholder="None" min="1" />
    </div>

    <div class="count-display" id="counter">0</div>

    <div class="read-container" id="readContainer">
      <div class="read-header">
        <div class="read-type-toggle">
          <button class="read-type-btn active" data-type="txt" id="typeTxtBtn">
            <svg class="icon" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
            TXT
          </button>
          <button class="read-type-btn" data-type="img" id="typeImgBtn">
            <svg class="icon" style="width:14px;height:14px;" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            IMG
          </button>
        </div>
      </div>
      <div class="read-content">
        <textarea id="readTextArea" aria-label="Reading text content" placeholder="Type something to read while counting..."></textarea>
        <div id="readImageContainer">
          <div class="image-placeholder">
            <svg class="icon" style="width:32px;height:32px;margin-bottom:8px;" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Tap to select image</span>
          </div>
          <img id="readImage" alt="Content to read" style="display:none;" />
        </div>
      </div>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
    </div>
  </main>

  <script>
    const KEYS = {
      COUNT: 'tally_count',
      LIMIT: 'tally_limit',
      MODE: 'tally_mode',
      THEME: 'tally_theme',
      HISTORY: 'tally_history',
      VIEW_MODE: 'tally_view_mode', // 'clean' or 'read'
      READ_TYPE: 'tally_read_type', // 'txt' or 'img'
      READ_TEXT: 'tally_read_text',
      READ_IMAGE: 'tally_read_image'
    };

    // State
    let count = parseInt(localStorage.getItem(KEYS.COUNT), 10) || 0;
    let limit = localStorage.getItem(KEYS.LIMIT) ? parseInt(localStorage.getItem(KEYS.LIMIT), 10) : null;
    let feedbackMode = localStorage.getItem(KEYS.MODE) ? parseInt(localStorage.getItem(KEYS.MODE), 10) : 1;
    let currentTheme = localStorage.getItem(KEYS.THEME) || 'default';
    let history = JSON.parse(localStorage.getItem(KEYS.HISTORY) || '[]');
    let viewMode = localStorage.getItem(KEYS.VIEW_MODE) || 'clean';
    let readType = localStorage.getItem(KEYS.READ_TYPE) || 'txt';
    let readText = localStorage.getItem(KEYS.READ_TEXT) || '';
    let readImage = localStorage.getItem(KEYS.READ_IMAGE) || null;

    // DOM Elements
    const counterEl = document.getElementById('counter');
    const tapArea = document.getElementById('tapArea');
    const limitInput = document.getElementById('limitInput');
    const resetBtn = document.getElementById('resetBtn');
    const drawerBtn = document.getElementById('drawerBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    const feedbackToggleBtn = document.getElementById('feedbackToggleBtn');
    const modeIcon = document.getElementById('modeIcon');
    const historyList = document.getElementById('historyList');

    // Read Mode Elements
    const readContainer = document.getElementById('readContainer');
    const modeSwitch = document.getElementById('modeSwitch');
    const typeTxtBtn = document.getElementById('typeTxtBtn');
    const typeImgBtn = document.getElementById('typeImgBtn');
    const readTextArea = document.getElementById('readTextArea');
    const readImageContainer = document.getElementById('readImageContainer');
    const readImageEl = document.getElementById('readImage');
    const imageInput = document.getElementById('imageInput');
    const imagePlaceholder = readImageContainer.querySelector('.image-placeholder');

    const icons = {
      vibrate: `<rect x="7" y="4" width="10" height="16" rx="2"></rect><path d="M4 8v8M20 8v8"></path>`,
      sound: `<path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`,
      silent: `<path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`
    };


// Web Audio API Sound Generator (Louder & Punchier)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playClickSound() {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  // Square wave adds harmonic richness so small mobile speakers play it louder
  osc.type = 'triangle'; 
  
  // Pitch sweep: starts at 800Hz and drops to 300Hz for a crisp click
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
  
  // Increased volume gain from 0.15 to 0.85
  gain.gain.setValueAtTime(0.85, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}
    
    function triggerFeedback() {
      if (feedbackMode === 1 && navigator.vibrate) navigator.vibrate(40);
      else if (feedbackMode === 2) playClickSound();
    }

    function updateModeIcon() {
      modeIcon.innerHTML = feedbackMode === 1 ? icons.vibrate : feedbackMode === 2 ? icons.sound : icons.silent;
    }

    function setTheme(theme) {
      document.body.className = theme === 'default' ? '' : theme;
      currentTheme = theme;
      localStorage.setItem(KEYS.THEME, theme);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }

    function renderHistory() {
      historyList.innerHTML = history.length ? history.map(item => `
        <li class="history-item">
          <span>${item.date}</span>
          <strong>${item.count}</strong>
        </li>
      `).join('') : '<li style="color:var(--text-sub); font-size:0.85rem;">No history yet.</li>';
    }

    function setViewMode(mode) {
      viewMode = mode;
      localStorage.setItem(KEYS.VIEW_MODE, mode);
      readContainer.classList.toggle('active', mode === 'read');
      modeSwitch.checked = (mode === 'read');
    }

    function setReadType(type) {
      readType = type;
      localStorage.setItem(KEYS.READ_TYPE, type);

      typeTxtBtn.classList.toggle('active', type === 'txt');
      typeImgBtn.classList.toggle('active', type === 'img');

      readTextArea.style.display = (type === 'txt' ? 'block' : 'none');
      readImageContainer.style.display = (type === 'img' ? 'flex' : 'none');
    }

    function initUI() {
      counterEl.textContent = count;
      if (limit !== null) limitInput.value = limit;
      updateModeIcon();
      setTheme(currentTheme);
      renderHistory();

      setViewMode(viewMode);
      setReadType(readType);
      readTextArea.value = readText;
      if (readImage) {
        readImageEl.src = readImage;
        readImageEl.style.display = 'block';
        imagePlaceholder.style.display = 'none';
      }
    }

    function updateCounter(nextValue, skipFeedback = false) {
      if (nextValue < 0) return;
      if (limit !== null && nextValue > limit) {
        counterEl.classList.add('at-limit');
        setTimeout(() => counterEl.classList.remove('at-limit'), 200);
        return;
      }
      count = nextValue;
      counterEl.textContent = count;
      localStorage.setItem(KEYS.COUNT, count);
      counterEl.classList.add('bump');
      setTimeout(() => counterEl.classList.remove('bump'), 50);
      if (!skipFeedback) triggerFeedback();
    }

    // Read Mode Event Handlers
    modeSwitch.addEventListener('change', (e) => {
      setViewMode(e.target.checked ? 'read' : 'clean');
    });

    typeTxtBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setReadType('txt');
    });

    typeImgBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setReadType('img');
    });

    readTextArea.addEventListener('input', (e) => {
      readText = e.target.value;
      localStorage.setItem(KEYS.READ_TEXT, readText);
    });

    readContainer.addEventListener('click', (e) => {
      e.stopPropagation(); // Don't count when clicking container
    });

    readImageContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      imageInput.click();
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          readImage = event.target.result;
          localStorage.setItem(KEYS.READ_IMAGE, readImage);
          readImageEl.src = readImage;
          readImageEl.style.display = 'block';
          imagePlaceholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // Drawer toggles
    function toggleDrawer(open) {
      drawer.classList.toggle('open', open);
      overlay.classList.toggle('open', open);
    }

    drawerBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleDrawer(true); });
    overlay.addEventListener('click', () => toggleDrawer(false));

    // Theme selector
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setTheme(btn.dataset.theme);
      });
    });

// Add clear button DOM reference
const clearHistoryBtn = document.getElementById('clearHistoryBtn');

// Function to clear the history log from state and LocalStorage
function clearHistory() {
  history = [];
  localStorage.removeItem(KEYS.HISTORY); // Specifically deletes only the history key
  renderHistory();
}

// Event listener for the Clear History button
clearHistoryBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  clearHistory();
});

    // Tap Surface
    tapArea.addEventListener('click', (e) => {
      if (e.target.closest('header') || e.target.closest('.limiter-bar') || drawer.classList.contains('open')) return;
      updateCounter(count + 1);
    });

    // Volume Keys
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === limitInput) return;
      if (e.key === 'AudioVolumeUp' || e.key === 'VolumeUp') {
        e.preventDefault();
        updateCounter(count + 1);
      } else if (e.key === 'AudioVolumeDown' || e.key === 'VolumeDown') {
        e.preventDefault();
        updateCounter(count - 1);
      }
    });

    limitInput.addEventListener('click', (e) => e.stopPropagation());

    // Limiter
    limitInput.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      if (!isNaN(val) && val > 0) {
        limit = val;
        localStorage.setItem(KEYS.LIMIT, limit);
      } else {
        limit = null;
        localStorage.removeItem(KEYS.LIMIT);
      }
      if (limit !== null && count > limit) updateCounter(limit, true);
    });

    // Feedback Mode Toggle
    feedbackToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      feedbackMode = (feedbackMode + 1) % 3;
      localStorage.setItem(KEYS.MODE, feedbackMode);
      updateModeIcon();
    });

    // Reset with History Log
    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (count > 0) {
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        history.unshift({ count, date: timeStr });
        if (history.length > 20) history.pop();
        localStorage.setItem(KEYS.HISTORY, JSON.stringify(history));
        renderHistory();
      }
      updateCounter(0);
    });

    initUI();
  </script>
</body>
</html>
